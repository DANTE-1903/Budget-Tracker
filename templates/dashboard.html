    <html>
            <head>
                <title>Expense Tracker Dashboard</title>
                <style>
                    body {
                        margin: 0;
                        padding: 0;
                        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                        background: linear-gradient(135deg, #1f4068, #162447, #1b1b2f);
                        min-height: 100vh;
                        display: flex;
                        flex-direction: column;
                        justify-content: center;
                        align-items: center;
                        gap: 100px;
                        color: #fff;
                    }
                    .glass-container {
                        background: rgba(255, 255, 255, 0.05);
                        backdrop-filter: blur(12px);
                        -webkit-backdrop-filter: blur(12px);
                        border: 1px solid rgba(255, 255, 255, 0.1);
                        border-radius: 16px;
                        padding: 30px;
                        width: 380px;
                        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
                        box-sizing: border-box;
                    }
                    h1, h2 {
                        text-align: center;
                    }
                    .remaining {
                        text-align: center;
                        color: #00f0ff;
                        font-weight: bold;
                        margin-bottom: 20px;
                    }
                    input {
                        width: 100%;
                        padding: 12px;
                        margin: 10px 0;
                        background: rgba(255, 255, 255, 0.07);
                        border: 1px solid rgba(255, 255, 255, 0.2);
                        border-radius: 8px;
                        color: #fff;
                        font-size: 15px;
                        box-sizing: border-box;
                    }
                    button {
                        width: 100%;
                        padding: 12px;
                        margin-top: 10px;
                        background: #00b4d8;
                        border: none;
                        border-radius: 8px;
                        color: #fff;
                        font-weight: bold;
                        font-size: 15px;
                        cursor: pointer;
                    }
                    .error {
                        color: #ff6b6b;
                        text-align: center;
                        font-size: 14px;
                        margin-top: 10px;
                    }
                </style>
            </head>
            <body>
                <div class="glass-container">
                    <h1>Expense Tracker</h1>
                    <div class="remaining">Remaining: {{budget}}</div>
                    <form method="POST">
                        <input type="text" name="item" placeholder="Expense name" required>
                        <input type="number" name="cost" placeholder="Cost" required>
                        <button type="submit">Add Expense</button>
                    </form>
                    <div class="error">{{error_message}}</div>
                </div>

                <div class="glass-container">
                    <h3 style="margin-top: 0; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;">EXPENSE HISTORY</h3>
                    <div>{{formatted_history}}</div>
                </div>
            </body>
        </html>
